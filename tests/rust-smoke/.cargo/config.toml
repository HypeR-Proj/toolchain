# This fixture exercises the freestanding runtime rather than HypeR std.
[build]
target = "aarch64-unknown-none"

# Local source navigation for Cargo discovery. The production hyper-cargo
# driver overrides these paths with installed SDK crates. Keep these patches
# out of the shared editor config so host workspaces retain their lockfiles.
[patch.crates-io]
hyper-abi = { path = "../../../../sdk/abi" }
hyper-os = { path = "../../../../stdlib/rust/hyper-os" }
hyper-rt = { path = "../../../../stdlib/rust/hyper-rt" }
hyper-sys = { path = "../../../../stdlib/rust/hyper-sys" }
hyper-filesystem = { path = "../../../../stdlib/rust/hyper-filesystem" }
