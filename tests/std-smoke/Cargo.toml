[package]
name = "hyper-std-smoke"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/HypeR-Proj/toolchain"

[workspace]

[dependencies]
hyper-abi = "=0.0.0"
hyper-sys = "=0.0.0"

[dependencies.hyper-os]
version = "=0.0.0"
features = ["std"]

[dependencies.hyper-rt]
version = "=0.0.0"
features = ["std"]

[dependencies.clap]
version = "=4.6.6"
features = ["derive", "env"]

[profile]

[profile.release]
panic = "abort"
