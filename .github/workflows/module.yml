name: Module tests
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: module-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: SDK consumers (${{ matrix.arch }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [aarch64, riscv64]
    env:
      SDK_CI_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: HypeR-Proj/ci/.github/actions/module@main
        with:
          component: ${{ github.event.repository.name }}
      - name: Collect module diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: module-${{ strategy.job-index }}
          path: |
            ${{ runner.temp }}/modules/source-inventory.json
            ${{ runner.temp }}/modules/target/**/*.log
            ${{ runner.temp }}/modules/kernel/target/**/*.log
          if-no-files-found: ignore
  module:
    if: always() && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - name: Require every module shard to pass
        env:
          RESULT: ${{ needs.test.result }}
        run: test "$RESULT" = success
